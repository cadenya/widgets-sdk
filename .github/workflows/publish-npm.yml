# Publishes @cadenya/widgets to npm via TRUSTED PUBLISHING (GitHub OIDC):
# no token secret — npm verifies this repo+workflow identity directly, and
# provenance attestation comes for free. Fires on release publish or manual
# dispatch.
name: Publish NPM
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Ensure OIDC-capable npm
        run: npm install -g npm@latest
      - run: npm publish
